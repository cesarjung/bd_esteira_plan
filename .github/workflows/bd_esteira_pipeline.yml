name: BD_Esteira Pipeline

on:
  schedule:
    # 05:00, 08:00, 13:00, 18:00 (Horário Brasília, UTC-3)
    #  → 8, 11, 16, 21 em UTC
    #
    # Dois runs fora do expediente (05h e 08h) garantem base fresca no início
    # do dia com a origem calma. Os outros dois (13h e 18h) mantêm atualização
    # durante o dia, aceitando que a origem esteja sendo editada.
    - cron: "0 8,11,16,21 * * *"
  workflow_dispatch:

# Um run por vez. O run novo cancela o anterior que ainda estiver preso,
# evitando dois jobs escrevendo nas mesmas planilhas (causava HTTP 409).
concurrency:
  group: bd-esteira-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Sem isso o job vai ate o limite padrao de 6h quando a origem trava.
    timeout-minutes: 25

    env:
      # Mesmo esquema do outro repositório:
      # coloque o JSON COMPLETO do service account no segredo GOOGLE_CREDENTIALS
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) BD_Carteira → BD_Esteira
        run: python exportar_esteira_carteira.py

      - name: 2) Replicar BD_Esteira para destinos
        run: python replicar_bd_esteira.py
